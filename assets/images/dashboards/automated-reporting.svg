<svg viewBox="0 0 440 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="autoTitle">
  <title id="autoTitle">Automated reporting workflow: Excel and OneDrive feeding Power Automate into Power BI, cutting manual reporting time by 30%</title>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B213E"/>
      <stop offset="60%" stop-color="#123056"/>
      <stop offset="130%" stop-color="#0B6B65"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FB6E8"/>
      <stop offset="100%" stop-color="#23C9B8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23C9B8"/>
    </marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="440" height="200" fill="url(#bg)"/>
  <rect width="440" height="200" fill="url(#grid)"/>

  <!-- connecting flow lines -->
  <path d="M92,58 C130,58 130,100 162,100" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <path d="M92,144 C130,144 130,102 162,102" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <path d="M228,100 C260,100 260,100 292,100" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <!-- traveling pulse dots -->
  <circle r="3.4" fill="#23C9B8">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M92,58 C130,58 130,100 162,100"/>
  </circle>
  <circle r="3.4" fill="#4FB6E8">
    <animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M92,144 C130,144 130,102 162,102"/>
  </circle>
  <circle r="3.4" fill="#23C9B8">
    <animateMotion dur="1.6s" begin="1.1s" repeatCount="indefinite" path="M228,100 C260,100 260,100 292,100"/>
  </circle>

  <!-- Node: Excel -->
  <g transform="translate(24,34)">
    <rect width="68" height="48" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)"/>
    <rect x="14" y="12" width="18" height="18" rx="3" fill="#1E7B4D"/>
    <path d="M17 15l12 12M29 15L17 27" stroke="#fff" stroke-width="1.6"/>
    <text x="40" y="27" font-family="Inter, sans-serif" font-size="10" fill="#EAF1F6" font-weight="600">Excel</text>
  </g>

  <!-- Node: OneDrive -->
  <g transform="translate(24,120)">
    <rect width="68" height="48" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)"/>
    <path d="M16 26a7 7 0 0 1 6-11 8 8 0 0 1 15-2 6 6 0 0 1 1 12z" fill="#4FB6E8" transform="translate(2,-2) scale(0.85)"/>
    <text x="40" y="27" font-family="Inter, sans-serif" font-size="10" fill="#EAF1F6" font-weight="600">OneDrive</text>
  </g>

  <!-- Node: Power Automate -->
  <g transform="translate(164,74)">
    <rect width="64" height="52" rx="12" fill="#0F8A82" stroke="#23C9B8"/>
    <path d="M32 12 L21 30 h9 l-4 16 15-20 h-9 z" fill="#fff"/>
    <text x="32" y="46" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#EAF6F4">Automate</text>
  </g>

  <!-- Node: Power BI -->
  <g transform="translate(294,58)">
    <rect width="84" height="80" rx="14" fill="#0B213E" stroke="#23C9B8" stroke-width="1.5"/>
    <rect x="16" y="48" width="10" height="18" fill="#4FB6E8"/>
    <rect x="30" y="36" width="10" height="30" fill="#23C9B8"/>
    <rect x="44" y="26" width="10" height="40" fill="#4FB6E8"/>
    <rect x="58" y="42" width="10" height="24" fill="#23C9B8"/>
    <text x="42" y="18" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#EAF6F4">Power BI</text>
  </g>

  <!-- Speed / impact badge -->
  <g transform="translate(348,18)">
    <rect width="76" height="30" rx="15" fill="rgba(35,201,184,0.16)" stroke="#23C9B8"/>
    <path d="M14 15 l4 -6 h4 l-3 5 h4 l-6 8 1 -5 h-4z" fill="#23C9B8"/>
    <text x="32" y="19" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#EAF6F4">-30%</text>
  </g>
  <text x="386" y="60" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="rgba(255,255,255,0.55)">manual work</text>

</svg>
